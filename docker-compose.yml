version: '3.8'
services:
  backend:
    build: ./backend
    volumes:
      - ./backend/templates:/app/templates
      - ./backend/output:/app/output
      - db_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: